[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datenbanktool"
dynamic = ["version"]
description = "Schreibgeschützte Analyse lokaler SQLite-Datenbanken"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
datenbanktool = "datenbanktool.cli:main"

[tool.setuptools.dynamic]
version = {attr = "datenbanktool.__version__"}

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
