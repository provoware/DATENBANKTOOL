[project]
name = "provoware-datenbanktool"
version = "0.1.0"
description = "Clean Foundation für das PROVOWARE DATENBANKTOOL"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data", "logs", "runtime", "backups", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
