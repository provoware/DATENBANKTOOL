[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datenbanktool"
version = "0.20.0a1"
description = "Absturzsicheres lokales Linux-Werkzeug mit lesender Wiederanlauf- und Restore-Protokollprüfung"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "provoware" }]
dependencies = []

[project.scripts]
datenbanktool = "datenbanktool.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["datenbanktool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
