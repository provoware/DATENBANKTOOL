name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python-Werkzeuge installieren
        run: python -m pip install --upgrade pytest ruff
      - name: Web-Formatter installieren
        run: npm install --ignore-scripts
      - name: Ruff Lint
        run: python -m ruff check .
      - name: Ruff Format prüfen
        run: python -m ruff format --check .
      - name: Prettier prüfen
        run: npm run format:check
      - name: Tests
        run: pytest -q
      - name: Projektstandards prüfen
        run: python tools/check_project.py
