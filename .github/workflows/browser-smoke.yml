name: Browser Smoke

on:
  push:
    branches:
      - main
      - "agent/p0-012a-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    env:
      PROVOWARE_DB_PATH: ${{ runner.temp }}/provoware-browser.sqlite3
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Browser-Testwerkzeuge installieren
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Automatischen Browser-Smoke ausführen
        run: npm run browser:smoke

      - name: Browser-Evidence hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
